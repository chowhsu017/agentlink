[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlink"
version = "0.1.0"
description = "Agent-to-Agent 实时通信协议 — 会话生命周期 + E2EE + 频道 + Presence"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41.0",
    "httpx>=0.25",
    "websockets>=12.0",
]

[project.urls]
Repository = "https://github.com/chowhsu017/agentlink"

[project.scripts]
agentlink = "agentlink.cli:main"

[project.optional-dependencies]
demo = ["fastapi>=0.100", "uvicorn>=0.23"]
full = ["fastapi>=0.100", "uvicorn>=0.23"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentlink*"]
